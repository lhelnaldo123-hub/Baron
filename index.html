<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#07080d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="apple-touch-icon" href="/jarvis-icon-192.png">
<style>
  :root { --l: 0; --c1: #3b4a7a; --c2: #2a3358; --c3: #5a6aa8;
    --bg: radial-gradient(130% 55% at 50% 100%, #1a2175 0%, #07080d 62%);
    --fg: #e8eaf2; --muted: #98a0c0; --ba: #1b2142; --bu: #2c3a78; --btn: #11152b; --line: #2a315a; }
  body.light { --bg: linear-gradient(#f4f2ff, #dbe4ff); --fg: #1b2140; --muted: #5b6485;
    --ba: #ffffff; --bu: #c9dcff; --btn: #ffffffd9; --line: #c5d0f0; }
  body[data-s="listen"] { --c1: #19d3c5; --c2: #2f6bff; --c3: #7be0ff; }
  body[data-s="think"]  { --c1: #a56bff; --c2: #ff6bd5; --c3: #6b8bff; }
  body[data-s="speak"]  { --c1: #ff8a3d; --c2: #ff3d8b; --c3: #ffd36b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--c2); outline-offset: 3px; }

  header { display: flex; align-items: center; justify-content: space-between; padding: .7rem 1rem; }
  .ib { width: 40px; height: 40px; border: 0; background: none; display: grid; place-items: center; border-radius: 50%; }
  .ib svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .hd { display: flex; align-items: center; gap: .6rem; }
  .title { text-align: left; }
  .title b { display: block; font-size: 1.15rem; }
  .title span { font-size: .8rem; color: var(--muted); }
  .title span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; margin-right: 6px; }

  #chat { flex: 1; overflow-y: auto; padding: .5rem 1rem; display: flex; flex-direction: column; gap: .8rem; }
  #chat:empty::before { content: "Tap the orb and start talking, or type a message."; margin: auto; color: var(--muted); text-align: center; max-width: 26ch; }
  .m { display: flex; gap: .5rem; max-width: 88%; }
  .m.u { align-self: flex-end; }
  .col { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  .b { padding: .65rem .9rem; border-radius: 18px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .a .b { background: var(--ba); border-bottom-left-radius: 6px;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--c2) 45%, transparent), 0 6px 22px -10px var(--c2); }
  .u .b { background: var(--bu); border-bottom-right-radius: 6px; }
  .av.big { width: 42px; height: 42px; margin: 0; }
  .av { flex: none; width: 30px; height: 30px; border-radius: 50%; margin-top: 2px;
    background: conic-gradient(var(--c1), var(--c2), var(--c3), var(--c1)); }
  .cp { border: 0; background: none; color: var(--muted); font-size: .78rem; padding: .25rem .4rem; }
  .wait .b { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  .stage { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 1.1rem 0 .4rem; }
  .bars { display: flex; align-items: center; gap: 3px; height: 64px; }
  .bars b { width: 4px; height: 100%; border-radius: 2px; background: linear-gradient(var(--c3), var(--c2));
    transform: scaleY(.12); transition: transform .08s linear; }
  .orbw { position: relative; width: min(34vw, 150px); aspect-ratio: 1; flex: none; }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--c1); opacity: 0; pointer-events: none; }
  body[data-s="listen"] .ring, body[data-s="speak"] .ring { animation: ripple 2.4s ease-out infinite; }
  body[data-s="listen"] .r2, body[data-s="speak"] .r2 { animation-delay: 1.2s; }
  @keyframes ripple { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(1.75); opacity: 0; } }
  .orb svg { position: absolute; inset: 0; margin: auto; width: 34%; height: 34%; z-index: 2; fill: none; stroke: #fff;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px #0006); }
  .orb { position: relative; width: 100%; aspect-ratio: 1; border: 0; padding: 0; border-radius: 50%;
    overflow: hidden; background: #0c0e17; transform: scale(calc(1 + var(--l) * .28));
    transition: transform .08s linear, box-shadow .6s; box-shadow: 0 0 60px -8px var(--c1); }
  .orb i { position: absolute; width: 85%; height: 85%; border-radius: 50%; filter: blur(22px);
    mix-blend-mode: screen; transition: background .8s; animation: flow 8s ease-in-out infinite; }
  .orb i:nth-child(1) { background: var(--c1); top: -15%; left: -15%; }
  .orb i:nth-child(2) { background: var(--c2); bottom: -15%; right: -15%; animation-duration: 10s; animation-delay: -3s; }
  .orb i:nth-child(3) { background: var(--c3); top: 18%; left: 18%; animation-duration: 12s; animation-delay: -6s; }
  body[data-s="think"] .orb i { animation-duration: 2.8s; }
  @keyframes flow {
    0%, 100% { transform: translate(0, 0) rotate(0) scale(1); }
    33% { transform: translate(28%, 14%) rotate(120deg) scale(1.2); }
    66% { transform: translate(-14%, 28%) rotate(240deg) scale(.9); }
  }
  .dots { display: flex; justify-content: center; gap: 6px; height: 8px; visibility: hidden; margin-bottom: .5rem; }
  .dots b { width: 7px; height: 7px; border-radius: 50%; background: var(--c2); animation: bounce 1s ease-in-out infinite; }
  .dots b:nth-child(2) { animation-delay: .15s; } .dots b:nth-child(3) { animation-delay: .3s; }
  body[data-s="think"] .dots, body[data-s="speak"] .dots { visibility: visible; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-5px); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .orb i, .wait .b, .ring, .dots b { animation: none !important; } }
  #st { text-align: center; margin: .3rem 0 .6rem; font-size: .95rem; color: var(--muted); min-height: 1.4em; padding: 0 1rem; }

  .tf { display: flex; gap: .5rem; padding: 0 1rem .6rem; }
  .tf[hidden] { display: none; }
  .tf input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--btn); color: var(--fg);
    border-radius: 999px; padding: .7rem 1rem; font: inherit; }
  .tf button { border: 0; border-radius: 999px; padding: 0 1.1rem; background: var(--c2); color: #fff; }
  .btns { display: flex; gap: .6rem; padding: 0 1rem 1rem; }
  .btns button { flex: 1; display: flex; align-items: center; justify-content: center; gap: .45rem;
    padding: .8rem; border-radius: 999px; border: 1px solid var(--line); background: var(--btn); }
  .btns svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #end { color: #ff5a5a; }
  .hr { display: flex; gap: .2rem; }
  .vmbar { display: none; justify-content: space-between; padding: .7rem 1rem; }
  .vmbar .ib, .hr .ib { background: var(--btn); }
  body.vm header, body.vm #chat, body.vm .bars, body.vm .dots, body.vm .tf, body.vm #kb, body.vm #st, body.vm .orb svg { display: none !important; }
  body.vm #st.bad { display: block !important; }
  body.vm .vmbar { display: flex; }
  body.vm .stage { flex: 1; padding: 0; }
  body.vm .orbw { width: min(62vw, 260px); }
  #sheet { position: fixed; inset: 0; background: #0008; display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  #sheet[hidden] { display: none; }
  .card { width: 100%; max-width: 480px; background: var(--ba); color: var(--fg); border-radius: 22px 22px 0 0;
    padding: 1.1rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: .6rem;
    max-height: 90dvh; overflow: auto; }
  .card h3 { margin: 0 0 .2rem; }
  .card label { font-size: .8rem; color: var(--muted); margin-top: .4rem; }
  .card select, .card input { width: 100%; border: 1px solid var(--line); background: var(--btn); color: var(--fg);
    border-radius: 12px; padding: .7rem .8rem; font: inherit; }
  .card button { border: 1px solid var(--line); background: var(--btn); border-radius: 12px; padding: .65rem .9rem; flex: 1; }
  .card .pri { background: var(--c2); color: #fff; border: 0; }
  .seg { display: flex; gap: .5rem; }
  #vmsg { font-size: .85rem; color: var(--muted); min-height: 1.2em; }
  .help { font-size: .8rem; color: var(--muted); line-height: 1.4; margin: 0; }
</style>
</head>
<body data-s="idle">
  <header>
    <button class="ib" id="new" aria-label="New chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <div class="hd"><i class="av big"></i><div class="title"><b>Jarvis</b><span>Always here to help…</span></div></div>
    <div class="hr"><button class="ib" id="vmb" aria-label="Voice mode"><svg viewBox="0 0 24 24"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg></button><button class="ib" id="gear" aria-label="Switch light or dark theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  </header>
  <div class="vmbar">
    <button class="ib" id="vback" aria-label="Back to chat"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></button>
    <button class="ib" id="vset" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </div>

  <div id="chat" aria-live="polite"></div>

  <div class="stage">
    <div class="bars" aria-hidden="true"></div>
    <div class="orbw"><span class="ring"></span><span class="ring r2"></span>
      <button class="orb" id="orb" aria-label="Tap to talk"><i></i><i></i><i></i>
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button></div>
    <div class="bars" aria-hidden="true"></div>
  </div>
  <p id="st">Tap the orb to start talking</p>
  <div class="dots" aria-hidden="true"><b></b><b></b><b></b></div>

  <form class="tf" id="tf" hidden>
    <input id="ti" placeholder="Type a message" autocomplete="off" aria-label="Type a message">
    <button type="submit">Send</button>
  </form>
  <div class="btns">
    <button id="kb"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>Type</button>
    <button id="pause"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg><span>Pause</span></button>
    <button id="end"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>End</button>
  </div>
  <audio id="a" playsinline></audio>

  <div id="sheet" hidden>
    <div class="card">
      <h3>Settings</h3>
      <label>Theme</label>
      <div class="seg"><button id="thd">Dark</button><button id="thl">Light</button></div>
      <label>Language</label>
      <select id="lsel" aria-label="Choose language"></select>
      <label>Voice</label>
      <select id="vsel" aria-label="Choose voice"></select>
      <div class="seg"><button id="vtest">Test voice</button><button id="vdel">Remove</button></div>
      <label>Add a voice</label>
      <input id="vname" placeholder="Name (for example Sarah)" autocomplete="off">
      <input id="vid" placeholder="Paste Fish voice link or ID" autocomplete="off">
      <button id="vadd">Add voice</button>
      <p class="help">On fish.audio, open a voice you like and copy its link from the browser. Paste it above.</p>
      <div id="vmsg"></div>
      <button id="inst">Install app</button>
      <button class="pri" id="done">Done</button>
    </div>
  </div>

<script>
const $ = s => document.querySelector(s);
const player = $("#a"), chat = $("#chat");
const SILENCE = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
const TYPES = [["audio/webm;codecs=opus", "webm"], ["audio/mp4", "mp4"], ["audio/ogg", "ogg"]];
const [mime, ext] = TYPES.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t[0])) || ["", "webm"];

let state = "idle", on = false, paused = false, ctx, micAn, outAn, stream, rec, chunks = [];
let speechStart = 0, lastVoice = 0;
const load = k => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch (e) { return []; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const LANGS = [["", "Auto-detect"], ["en", "English"], ["es", "Spanish"], ["fr", "French"], ["de", "German"], ["pt", "Portuguese"],
  ["it", "Italian"], ["hi", "Hindi"], ["ar", "Arabic"], ["zh", "Chinese"], ["ja", "Japanese"], ["ko", "Korean"], ["ru", "Russian"],
  ["tr", "Turkish"], ["sw", "Swahili"], ["yo", "Yoruba"], ["ha", "Hausa"]];
let lang = ""; try { lang = localStorage.getItem("jv-lang") || ""; } catch (e) {}
let history = load("jv-history"), memory = load("jv-memory"), voices = load("jv-voices"), voice = "";
try { voice = localStorage.getItem("jv-voice") || ""; } catch (e) {}

// waveform bars either side of the orb
document.querySelectorAll(".bars").forEach(g => { for (let i = 0; i < 8; i++) g.append(document.createElement("b")); });
const bars = [...document.querySelectorAll(".bars b")];
const barsTo = (l, now) => bars.forEach((b, i) =>
  b.style.transform = `scaleY(${(.12 + l * (.35 + .65 * Math.abs(Math.sin(now / 160 + i * .9)))).toFixed(3)})`);

function set(s, text) {
  state = s; document.body.dataset.s = s;
  if (text !== undefined) { $("#st").textContent = text; $("#st").classList.toggle("bad", /^(Error|Microphone)/.test(text)); }
}

const data = new Float32Array(1024);
function level(an) {
  an.getFloatTimeDomainData(data);
  let sum = 0; for (const v of data) sum += v * v;
  return Math.min(1, Math.sqrt(sum / data.length) * 10);
}

function bubble(role, text, before, pending) {
  const el = document.createElement("div");
  el.className = "m " + role + (pending ? " wait" : "");
  if (role === "a") { const av = document.createElement("i"); av.className = "av"; el.append(av); }
  const col = document.createElement("div"); col.className = "col";
  const b = document.createElement("div"); b.className = "b"; b.textContent = pending ? "…" : text; col.append(b);
  if (role === "a" && text) {
    const c = document.createElement("button"); c.className = "cp"; c.textContent = "Copy";
    c.onclick = () => navigator.clipboard.writeText(text).then(() => {
      c.textContent = "Copied"; setTimeout(() => c.textContent = "Copy", 1500);
    }).catch(() => {});
    col.append(c);
  }
  el.append(col);
  chat.insertBefore(el, before || null);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

async function begin() {
  try {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      outAn = ctx.createAnalyser(); outAn.fftSize = 1024;
      ctx.createMediaElementSource(player).connect(outAn);
      outAn.connect(ctx.destination);
    }
    await ctx.resume();
    player.src = SILENCE; player.play().catch(() => {}); // unlocks audio on iPhone
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    micAn = ctx.createAnalyser(); micAn.fftSize = 1024;
    ctx.createMediaStreamSource(stream).connect(micAn);
    on = true; paused = false; listen(); tick();
  } catch (e) {
    set("idle", "Microphone blocked. Allow mic access and tap again.");
  }
}

function stopRec() {
  try { if (rec && rec.state !== "inactive") { rec.onstop = null; rec.stop(); } } catch (e) {}
}

function end() {
  on = false; paused = false; stopRec();
  stream && stream.getTracks().forEach(t => t.stop());
  player.pause(); document.body.style.setProperty("--l", 0); barsTo(0, 0);
  $("#pause span").textContent = "Pause";
  set("idle", "Tap the orb to start talking");
}

function pause() {
  if (!on) return;
  if (!paused) {
    paused = true; player.pause(); stopRec(); barsTo(0, 0);
    document.body.style.setProperty("--l", 0);
    $("#pause span").textContent = "Resume"; set("idle", "Paused");
  } else {
    paused = false; $("#pause span").textContent = "Pause"; listen();
  }
}

function listen() {
  chunks = []; speechStart = 0;
  rec = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.start();
  set("listen", "Listening…");
}

function finish() {
  const spoke = lastVoice - speechStart;
  rec.onstop = () => spoke < 400 ? listen() : sendBlob(new Blob(chunks, { type: rec.mimeType }));
  set("think", "Thinking…");
  rec.stop();
}

function tick() {
  if (!on) return;
  const now = performance.now();
  const mic = level(micAn);
  const shown = state === "speak" ? level(outAn) : state === "listen" ? mic : 0;
  document.body.style.setProperty("--l", shown.toFixed(3));
  barsTo(shown, now);

  if (state === "listen") {
    if (mic > .12) { if (!speechStart) speechStart = now; lastVoice = now; }
    else if (speechStart && now - lastVoice > 900) finish();
  } else if (state === "speak" && mic > .35) {
    player.pause(); listen(); // you interrupted
  }
  requestAnimationFrame(tick);
}

async function sendBlob(blob) {
  const audio = await new Promise(ok => {
    const f = new FileReader(); f.onload = () => ok(f.result.split(",")[1]); f.readAsDataURL(blob);
  });
  send({ audio, ext });
}

let turn = 0;
async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Request failed");
  return d;
}

async function send(payload, typed) {
  const my = ++turn;
  const wait = bubble("a", "", null, true);
  if (typed) bubble("u", typed, wait);
  try {
    const d = await post("/api/voice", { ...payload, history, memory, lang, langName: (LANGS.find(l => l[0] === lang) || [])[1] || "" });
    if (!d.reply) { wait.remove(); if (on && !paused) listen(); return; }
    if (!typed) bubble("u", d.user, wait);
    bubble("a", d.reply, wait); wait.remove();
    history.push({ role: "user", content: d.user }, { role: "assistant", content: d.reply + "\nSAY: " + d.say });
    history = history.slice(-16); save("jv-history", history);
    if (d.mem && !memory.includes(d.mem)) { memory.push(d.mem); memory = memory.slice(-30); save("jv-memory", memory); }
    if (!on || paused) return;
    const v = await post("/api/speak", { text: d.say || d.reply, voice });   // text is already on screen while this loads
    if (my !== turn || !on || paused) return;
    player.src = "data:audio/mpeg;base64," + v.audio;
    set("speak", "Speaking…");
    await player.play();
  } catch (e) {
    wait.remove(); set("idle", "Error: " + (navigator.onLine ? e.message : "No internet. I need to be online to talk."));
    if (on && !paused) setTimeout(() => on && !paused && listen(), 3000);
  }
}

player.onended = () => { if (on && !paused && state === "speak") listen(); };
$("#orb").onclick = () => {
  if (!on) begin();
  else if (paused) pause();
  else if (state === "speak") { player.pause(); listen(); }
};
$("#end").onclick = () => { end(); vmOff(); };
$("#pause").onclick = pause;
$("#new").onclick = () => { history = []; save("jv-history", history); chat.replaceChildren(); };
$("#kb").onclick = () => { const f = $("#tf"); f.hidden = !f.hidden; if (!f.hidden) $("#ti").focus(); };
$("#tf").onsubmit = e => {
  e.preventDefault();
  const t = $("#ti").value.trim(); if (!t) return;
  $("#ti").value = "";
  if (on && !paused) { player.pause(); stopRec(); set("think", "Thinking…"); }
  send({ text: t, silent: !on || paused }, t);
};

function theme(light) {
  document.body.classList.toggle("light", light);
  try { localStorage.setItem("jv-theme", light ? "light" : "dark"); } catch (e) {}
}
try { theme(localStorage.getItem("jv-theme") === "light"); } catch (e) {}

LANGS.forEach(l => $("#lsel").append(new Option(l[1], l[0])));
$("#lsel").value = lang;
$("#lsel").onchange = e => { lang = e.target.value; try { localStorage.setItem("jv-lang", lang); } catch (x) {} };
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
let installEv = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEv = e; });
if (matchMedia("(display-mode: standalone)").matches || navigator.standalone) $("#inst").hidden = true;
$("#inst").onclick = () => {
  if (installEv) { installEv.prompt(); installEv = null; }
  else $("#vmsg").textContent = "iPhone: tap Share, then Add to Home Screen. Android: open the browser menu, then Install app.";
};
function vmOff() { document.body.classList.remove("vm"); }
$("#vmb").onclick = async () => { document.body.classList.add("vm"); if (!on) await begin(); };
$("#vback").onclick = () => { end(); vmOff(); };
$("#vset").onclick = () => { $("#vmsg").textContent = ""; $("#sheet").hidden = false; };
function drawVoices() {
  const sel = $("#vsel"); sel.replaceChildren(new Option("Default voice", ""));
  voices.forEach(v => sel.append(new Option(v.name, v.id)));
  sel.value = voice; voice = sel.value;
}
function pick(v) { voice = v; try { localStorage.setItem("jv-voice", v); } catch (e) {} }
drawVoices();
$("#gear").onclick = () => { $("#vmsg").textContent = ""; $("#sheet").hidden = false; };
$("#done").onclick = () => $("#sheet").hidden = true;
$("#sheet").onclick = e => { if (e.target.id === "sheet") e.target.hidden = true; };
$("#thd").onclick = () => theme(false);
$("#thl").onclick = () => theme(true);
$("#vsel").onchange = e => pick(e.target.value);
$("#vadd").onclick = () => {
  const name = $("#vname").value.trim() || "My voice";
  const id = $("#vid").value.trim().split(/[\/?#]/).filter(Boolean).pop() || "";
  if (!/^[\w-]{8,64}$/.test(id)) { $("#vmsg").textContent = "That doesn't look like a voice link or ID."; return; }
  voices = voices.filter(v => v.id !== id).concat({ name, id }); save("jv-voices", voices);
  pick(id); drawVoices(); $("#vname").value = $("#vid").value = ""; $("#vmsg").textContent = "Added. Tap Test voice to hear it.";
};
$("#vdel").onclick = () => {
  if (!voice) return;
  voices = voices.filter(v => v.id !== voice); save("jv-voices", voices); pick(""); drawVoices();
};
$("#vtest").onclick = async () => {
  $("#vmsg").textContent = "Loading voice…";
  try {
    const v = await post("/api/speak", { text: "Hello! This is how I sound.", voice });
    player.src = "data:audio/mpeg;base64," + v.audio; await player.play(); $("#vmsg").textContent = "";
  } catch (e) { $("#vmsg").textContent = e.message; }
};
</script>
</body>
