<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<style>
  :root { --l: 0; --c1: #3b4a7a; --c2: #2a3358; --c3: #5a6aa8;
    --bg: radial-gradient(130% 55% at 50% 100%, #1a2175 0%, #07080d 62%);
    --fg: #e8eaf2; --muted: #98a0c0; --ba: #1b2142; --bu: #2c3a78; --btn: #11152b; --line: #2a315a; }
  body.light { --bg: linear-gradient(#f1f4fd, #dde5fb); --fg: #1b2140; --muted: #5b6485;
    --ba: #ffffff; --bu: #c9dcff; --btn: #ffffffd9; --line: #c5d0f0; }
  body[data-s="listen"] { --c1: #19d3c5; --c2: #2f6bff; --c3: #7be0ff; }
  body[data-s="think"]  { --c1: #a56bff; --c2: #ff6bd5; --c3: #6b8bff; }
  body[data-s="speak"]  { --c1: #ff8a3d; --c2: #ff3d8b; --c3: #ffd36b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--c2); outline-offset: 3px; }

  header { display: flex; align-items: center; justify-content: space-between; padding: .7rem 1rem; }
  .ib { width: 40px; height: 40px; border: 0; background: none; display: grid; place-items: center; border-radius: 50%; }
  .ib svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .title { text-align: center; }
  .title b { display: block; font-size: 1.15rem; }
  .title span { font-size: .8rem; color: var(--muted); }
  .title span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; margin-right: 6px; }

  #chat { flex: 1; overflow-y: auto; padding: .5rem 1rem; display: flex; flex-direction: column; gap: .8rem; }
  #chat:empty::before { content: "Tap the orb and start talking, or type a message."; margin: auto; color: var(--muted); text-align: center; max-width: 26ch; }
  .m { display: flex; gap: .5rem; max-width: 88%; }
  .m.u { align-self: flex-end; }
  .col { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  .b { padding: .65rem .9rem; border-radius: 18px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .a .b { background: var(--ba); border-bottom-left-radius: 6px; }
  .u .b { background: var(--bu); border-bottom-right-radius: 6px; }
  .av { flex: none; width: 30px; height: 30px; border-radius: 50%; margin-top: 2px;
    background: conic-gradient(var(--c1), var(--c2), var(--c3), var(--c1)); }
  .cp { border: 0; background: none; color: var(--muted); font-size: .78rem; padding: .25rem .4rem; }
  .wait .b { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  .stage { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 1.1rem 0 .4rem; }
  .bars { display: flex; align-items: center; gap: 3px; height: 64px; }
  .bars b { width: 4px; height: 100%; border-radius: 2px; background: linear-gradient(var(--c3), var(--c2));
    transform: scaleY(.12); transition: transform .08s linear; }
  .orb { position: relative; width: min(34vw, 150px); aspect-ratio: 1; border: 0; padding: 0; border-radius: 50%;
    overflow: hidden; background: #0c0e17; transform: scale(calc(1 + var(--l) * .28));
    transition: transform .08s linear, box-shadow .6s; box-shadow: 0 0 60px -8px var(--c1); }
  .orb i { position: absolute; width: 85%; height: 85%; border-radius: 50%; filter: blur(22px);
    mix-blend-mode: screen; transition: background .8s; animation: flow 8s ease-in-out infinite; }
  .orb i:nth-child(1) { background: var(--c1); top: -15%; left: -15%; }
  .orb i:nth-child(2) { background: var(--c2); bottom: -15%; right: -15%; animation-duration: 10s; animation-delay: -3s; }
  .orb i:nth-child(3) { background: var(--c3); top: 18%; left: 18%; animation-duration: 12s; animation-delay: -6s; }
  body[data-s="think"] .orb i { animation-duration: 2.8s; }
  @keyframes flow {
    0%, 100% { transform: translate(0, 0) rotate(0) scale(1); }
    33% { transform: translate(28%, 14%) rotate(120deg) scale(1.2); }
    66% { transform: translate(-14%, 28%) rotate(240deg) scale(.9); }
  }
  @media (prefers-reduced-motion: reduce) { .orb i, .wait .b { animation: none; } }
  #st { text-align: center; margin: .3rem 0 .6rem; font-size: .95rem; color: var(--muted); min-height: 1.4em; padding: 0 1rem; }

  .tf { display: flex; gap: .5rem; padding: 0 1rem .6rem; }
  .tf[hidden] { display: none; }
  .tf input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--btn); color: var(--fg);
    border-radius: 999px; padding: .7rem 1rem; font: inherit; }
  .tf button { border: 0; border-radius: 999px; padding: 0 1.1rem; background: var(--c2); color: #fff; }
  .btns { display: flex; gap: .6rem; padding: 0 1rem 1rem; }
  .btns button { flex: 1; display: flex; align-items: center; justify-content: center; gap: .45rem;
    padding: .8rem; border-radius: 999px; border: 1px solid var(--line); background: var(--btn); }
  .btns svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #end { color: #ff5a5a; }
</style>
</head>
<body data-s="idle">
  <header>
    <button class="ib" id="new" aria-label="New chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <div class="title"><b>Jarvis</b><span>Online</span></div>
    <button class="ib" id="gear" aria-label="Switch light or dark theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>

  <div id="chat" aria-live="polite"></div>

  <div class="stage">
    <div class="bars" aria-hidden="true"></div>
    <button class="orb" id="orb" aria-label="Tap to talk"><i></i><i></i><i></i></button>
    <div class="bars" aria-hidden="true"></div>
  </div>
  <p id="st">Tap the orb to start talking</p>

  <form class="tf" id="tf" hidden>
    <input id="ti" placeholder="Type a message" autocomplete="off" aria-label="Type a message">
    <button type="submit">Send</button>
  </form>
  <div class="btns">
    <button id="kb"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>Type</button>
    <button id="pause"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg><span>Pause</span></button>
    <button id="end"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>End</button>
  </div>
  <audio id="a" playsinline></audio>

<script>
const $ = s => document.querySelector(s);
const player = $("#a"), chat = $("#chat");
const SILENCE = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
const TYPES = [["audio/webm;codecs=opus", "webm"], ["audio/mp4", "mp4"], ["audio/ogg", "ogg"]];
const [mime, ext] = TYPES.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t[0])) || ["", "webm"];

let state = "idle", on = false, paused = false, ctx, micAn, outAn, stream, rec, chunks = [];
let speechStart = 0, lastVoice = 0, history = [];

// waveform bars either side of the orb
document.querySelectorAll(".bars").forEach(g => { for (let i = 0; i < 8; i++) g.append(document.createElement("b")); });
const bars = [...document.querySelectorAll(".bars b")];
const barsTo = (l, now) => bars.forEach((b, i) =>
  b.style.transform = `scaleY(${(.12 + l * (.35 + .65 * Math.abs(Math.sin(now / 160 + i * .9)))).toFixed(3)})`);

function set(s, text) {
  state = s; document.body.dataset.s = s;
  if (text !== undefined) $("#st").textContent = text;
}

const data = new Float32Array(1024);
function level(an) {
  an.getFloatTimeDomainData(data);
  let sum = 0; for (const v of data) sum += v * v;
  return Math.min(1, Math.sqrt(sum / data.length) * 10);
}

function bubble(role, text, before, pending) {
  const el = document.createElement("div");
  el.className = "m " + role + (pending ? " wait" : "");
  if (role === "a") { const av = document.createElement("i"); av.className = "av"; el.append(av); }
  const col = document.createElement("div"); col.className = "col";
  const b = document.createElement("div"); b.className = "b"; b.textContent = pending ? "…" : text; col.append(b);
  if (role === "a" && text) {
    const c = document.createElement("button"); c.className = "cp"; c.textContent = "Copy";
    c.onclick = () => navigator.clipboard.writeText(text).then(() => {
      c.textContent = "Copied"; setTimeout(() => c.textContent = "Copy", 1500);
    }).catch(() => {});
    col.append(c);
  }
  el.append(col);
  chat.insertBefore(el, before || null);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

async function begin() {
  try {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      outAn = ctx.createAnalyser(); outAn.fftSize = 1024;
      ctx.createMediaElementSource(player).connect(outAn);
      outAn.connect(ctx.destination);
    }
    await ctx.resume();
    player.src = SILENCE; player.play().catch(() => {}); // unlocks audio on iPhone
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    micAn = ctx.createAnalyser(); micAn.fftSize = 1024;
    ctx.createMediaStreamSource(stream).connect(micAn);
    on = true; paused = false; listen(); tick();
  } catch (e) {
    set("idle", "Microphone blocked. Allow mic access and tap again.");
  }
}

function stopRec() {
  try { if (rec && rec.state !== "inactive") { rec.onstop = null; rec.stop(); } } catch (e) {}
}

function end() {
  on = false; paused = false; stopRec();
  stream && stream.getTracks().forEach(t => t.stop());
  player.pause(); document.body.style.setProperty("--l", 0); barsTo(0, 0);
  $("#pause span").textContent = "Pause";
  set("idle", "Tap the orb to start talking");
}

function pause() {
  if (!on) return;
  if (!paused) {
    paused = true; player.pause(); stopRec(); barsTo(0, 0);
    document.body.style.setProperty("--l", 0);
    $("#pause span").textContent = "Resume"; set("idle", "Paused");
  } else {
    paused = false; $("#pause span").textContent = "Pause"; listen();
  }
}

function listen() {
  chunks = []; speechStart = 0;
  rec = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.start();
  set("listen", "Listening…");
}

function finish() {
  const spoke = lastVoice - speechStart;
  rec.onstop = () => spoke < 400 ? listen() : sendBlob(new Blob(chunks, { type: rec.mimeType }));
  set("think", "Thinking…");
  rec.stop();
}

function tick() {
  if (!on) return;
  const now = performance.now();
  const mic = level(micAn);
  const shown = state === "speak" ? level(outAn) : state === "listen" ? mic : 0;
  document.body.style.setProperty("--l", shown.toFixed(3));
  barsTo(shown, now);

  if (state === "listen") {
    if (mic > .12) { if (!speechStart) speechStart = now; lastVoice = now; }
    else if (speechStart && now - lastVoice > 1300) finish();
  } else if (state === "speak" && mic > .35) {
    player.pause(); listen(); // you interrupted
  }
  requestAnimationFrame(tick);
}

async function sendBlob(blob) {
  const audio = await new Promise(ok => {
    const f = new FileReader(); f.onload = () => ok(f.result.split(",")[1]); f.readAsDataURL(blob);
  });
  send({ audio, ext });
}

async function send(payload, typed) {
  const wait = bubble("a", "", null, true);
  if (typed) bubble("u", typed, wait);
  try {
    const r = await fetch("/api/voice", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...payload, history }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Request failed");
    if (!d.reply) { wait.remove(); if (on && !paused) listen(); return; }
    if (!typed) bubble("u", d.user, wait);
    bubble("a", d.reply, wait); wait.remove();
    history.push({ role: "user", content: d.user }, { role: "assistant", content: d.reply + "\nSAY: " + d.say });
    history = history.slice(-16);
    if (!on || paused || !d.audio) { if (on && !paused) listen(); return; }
    player.src = "data:audio/mpeg;base64," + d.audio;
    set("speak", "Speaking…");
    await player.play();
  } catch (e) {
    wait.remove(); set("idle", "Error: " + e.message);
    if (on && !paused) setTimeout(() => on && !paused && listen(), 3000);
  }
}

player.onended = () => { if (on && !paused && state === "speak") listen(); };
$("#orb").onclick = () => {
  if (!on) begin();
  else if (paused) pause();
  else if (state === "speak") { player.pause(); listen(); }
};
$("#end").onclick = end;
$("#pause").onclick = pause;
$("#new").onclick = () => { history = []; chat.replaceChildren(); };
$("#kb").onclick = () => { const f = $("#tf"); f.hidden = !f.hidden; if (!f.hidden) $("#ti").focus(); };
$("#tf").onsubmit = e => {
  e.preventDefault();
  const t = $("#ti").value.trim(); if (!t) return;
  $("#ti").value = "";
  if (on && !paused) { player.pause(); stopRec(); set("think", "Thinking…"); }
  send({ text: t, silent: !on || paused }, t);
};

function theme(light) {
  document.body.classList.toggle("light", light);
  try { localStorage.setItem("jv-theme", light ? "light" : "dark"); } catch (e) {}
}
try { theme(localStorage.getItem("jv-theme") === "light"); } catch (e) {}
$("#gear").onclick = () => theme(!document.body.classList.contains("light"));
</script>
</body>
  </html>
